    _convert_: 'all'
    time_horizon: 4
    interval_length: 0.5

checkpoint_path: null
lr: 1e-4
max_epochs: 100
scorer_dir: ???      # a scripts/train_scorer.sh mf run, e.g. exp/meanfuser_checkpoints/scorer_mf_design_seed0
